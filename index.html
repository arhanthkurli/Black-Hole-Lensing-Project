<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UV Warp Map Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #111318;
        color: #eef0f4;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(900px, calc(100% - 32px));
      }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(1.4rem, 4vw, 2rem);
      }

      p {
        color: #aeb5c1;
      }

      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        border: 1px solid #343945;
        border-radius: 8px;
        background: #000;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      button {
        padding: 10px 14px;
        border: 1px solid #4b5261;
        border-radius: 6px;
        background: #252a34;
        color: inherit;
        cursor: pointer;
        font: inherit;
      }

      button:hover:not(:disabled) {
        background: #343b49;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.5;
      }

      code {
        color: #d7dcff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lookup-map lensing demo</h1>
      <p>
        A four-quadrant test grid distorted by <code>warp-map.json</code>.
        Curved grid lines reveal the lensing; the black center is invalid.
      </p>
      <canvas id="view" aria-label="Distorted four-color background"></canvas>
      <div class="controls" aria-label="Image source controls">
        <button id="video-mode" type="button" disabled>Start video</button>
        <button id="picture-mode" type="button" disabled>Take camera picture</button>
        <button id="upload-button" type="button" disabled>Upload image</button>
        <button id="download-button" type="button" disabled>Download image</button>
        <input id="image-upload" type="file" accept="image/*" hidden />
      </div>
      <video id="camera" autoplay playsinline muted hidden></video>
      <p id="status">Loading warp map…</p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
